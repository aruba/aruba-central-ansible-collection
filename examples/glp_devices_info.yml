---
# Example playbook for HPE GreenLake Platform API calls
- name: Demo HPE GreenLake Platform Devices Info
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Get Devices in GLP
      arubanetworks.hpeanw_central.glp_devices_info:
        client_id: "{{ glp_client_id }}"
        client_secret: "{{ glp_client_secret }}"
        workspace_id: "{{ glp_workspace_id }}"
      register: devices_result
    
    - debug:
        var: devices_result

    - name: Get SERIAL in GLP
      arubanetworks.hpeanw_central.glp_devices_info:
        client_id: "{{ glp_client_id }}"
        client_secret: "{{ glp_client_secret }}"
        workspace_id: "{{ glp_workspace_id }}"
        subset: device_by_serial
        serial_number: "ABC123456"
      register: devices_result

    - debug:
        var: devices_result

    - name: Get Select MAC from All Devices in GLP
      arubanetworks.hpeanw_central.glp_devices_info:
        client_id: "{{ glp_client_id }}"
        client_secret: "{{ glp_client_secret }}"
        workspace_id: "{{ glp_workspace_id }}"
        select: "macAddress"
      register: devices_result

    - debug:
        var: devices_result

    - name: Get device by filter
      arubanetworks.hpeanw_central.glp_devices_info:
        client_id: "{{ glp_client_id }}"
        client_secret: "{{ glp_client_secret }}"
        workspace_id: "{{ glp_workspace_id }}"
        subset: device_by_filter
        device_filter: "serialNumber eq 'ABC123456'"
      register: devices_result

    - debug:
        var: devices_result

    - name: Get device by ID
      arubanetworks.hpeanw_central.glp_devices_info:
        client_id: "{{ glp_client_id }}"
        client_secret: "{{ glp_client_secret }}"
        workspace_id: "{{ glp_workspace_id }}"
        subset: device_by_id
        device_id: 111222333-444555-666777888-999000
      register: devices_result

    - debug:
        var: devices_result