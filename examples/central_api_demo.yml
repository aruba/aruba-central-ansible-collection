---
# Example playbook for HPE Aruba Networking Central API calls
- name: Demo HPE Aruba Networking Central API Calls
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Get devices from Central
      arubanetworks.hpeanw_central.central_api:
        base_url: "{{ central_base_url }}"
        client_id: "{{ glp_client_id }}"
        client_secret: "{{ glp_client_secret }}"
        workspace_id: "{{ glp_workspace_id }}"
        method: GET
        path: "/network-config/v1/sites"
      register: devices_result

    - debug:
        var: devices_result